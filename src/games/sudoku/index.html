<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/sudoku/styles.css">
  <title>Sudoku · Cache Only</title>
  <script type="module" src="/games/sudoku/sudoku.js"></script>
</head>
<body class="game-page sudoku-page">
  <div class="shell">
    <header class="bar">
      <button type="button" class="icon-btn" id="homeBtn" data-i18n-label="common.menu">
        <svg class="icon"><use href="#i-home"/></svg>
      </button>
      <div class="bar-stats">
        <div class="stat" id="levelStat">
          <span class="stat-label" id="levelLabel">&nbsp;</span>
          <span class="stat-value" id="timer">00:00</span>
        </div>
        <div class="lives bar-center" id="lives" role="img">
          <span class="life"><svg class="icon life-empty"><use href="#i-heart-empty"/></svg><svg class="icon life-full"><use href="#i-heart"/></svg><span class="life-half is-left"><svg class="icon"><use href="#i-heart"/></svg></span><span class="life-half is-right"><svg class="icon"><use href="#i-heart"/></svg></span></span>
          <span class="life"><svg class="icon life-empty"><use href="#i-heart-empty"/></svg><svg class="icon life-full"><use href="#i-heart"/></svg><span class="life-half is-left"><svg class="icon"><use href="#i-heart"/></svg></span><span class="life-half is-right"><svg class="icon"><use href="#i-heart"/></svg></span></span>
          <span class="life"><svg class="icon life-empty"><use href="#i-heart-empty"/></svg><svg class="icon life-full"><use href="#i-heart"/></svg><span class="life-half is-left"><svg class="icon"><use href="#i-heart"/></svg></span><span class="life-half is-right"><svg class="icon"><use href="#i-heart"/></svg></span></span>
        </div>
      </div>
    </header>

    <main class="play">
      <div class="board-wrap" id="boardWrap">
        <div class="board sudoku-board" id="board" role="group" data-i18n-label="sudoku.board"></div>
        <p class="board-note eyebrow" id="genNote" role="status" data-i18n="sudoku.generating" hidden></p>
      </div>

      <div class="controls">
        <div class="keypad" id="pad">
          <button type="button" class="key key-tool key-mode" id="notesBtn" aria-pressed="false"><span class="key-face"><svg class="icon"><use href="#i-pen"/></svg><span data-i18n="sudoku.notes"></span></span></button>
          <button type="button" class="key key-tool key-mode-tool" id="eraseBtn" data-i18n-label="sudoku.erase"><svg class="icon"><use href="#i-backspace"/></svg></button>
          <button type="button" class="key" data-d="1">1</button>
          <button type="button" class="key" data-d="2">2</button>
          <button type="button" class="key" data-d="3">3</button>
          <button type="button" class="key" data-d="4">4</button>
          <button type="button" class="key" data-d="5">5</button>
          <button type="button" class="key" data-d="6">6</button>
          <button type="button" class="key" data-d="7">7</button>
          <button type="button" class="key" data-d="8">8</button>
          <button type="button" class="key" data-d="9">9</button>
        </div>

        <!-- Before a puzzle: its difficulty, picked on a slider while the board shows where its
             numbers will be. It takes the moves' place, so the board never moves. -->
        <div class="chooser" id="chooser" role="group" aria-labelledby="pickName" hidden>
          <div class="chooser-head">
            <h2 class="t-title" id="pickName">&nbsp;</h2>
            <p class="eyebrow" id="pickBest"></p>
          </div>
          <div class="slider" id="levelSlider" data-i18n-label="sudoku.difficulty"></div>
          <div class="chooser-actions">
            <button type="button" class="btn btn-primary" id="startBtn" data-i18n="sudoku.start"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="side-menu" id="sideMenu" hidden>
    <div class="side-menu-blur pblur pblur-left" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <nav class="side-menu-list" data-i18n-label="common.menu">
      <button type="button" class="side-item" id="resumeBtn">
        <svg class="icon"><use href="#i-play"/></svg><span data-i18n="sudoku.resume"></span>
      </button>
      <button type="button" class="side-item" id="quitBtn">
        <svg class="icon"><use href="#i-flag"/></svg><span data-i18n="sudoku.quit"></span>
      </button>
      <a class="side-item is-exit" href="/">
        <svg class="icon"><use href="#i-games"/></svg><span data-i18n="common.back"></span>
      </a>
    </nav>
  </div>

  <dialog class="sheet" id="doneSheet" aria-labelledby="doneTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="doneTitle" data-i18n="sudoku.solved"></h2>
      </div>
      <p class="eyebrow" id="newBest" data-i18n="sudoku.newBest" hidden></p>
      <dl class="facts">
        <dt data-i18n="sudoku.difficulty"></dt><dd id="doneLevel"></dd>
        <dt data-i18n="sudoku.time"></dt><dd class="is-num" id="doneTime"></dd>
      </dl>
      <button type="button" class="btn btn-primary" id="doneNewBtn" data-i18n="sudoku.newPuzzle"></button>
    </form>
  </dialog>

  <dialog class="sheet" id="lostSheet" aria-labelledby="lostTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="lostTitle" data-i18n="sudoku.lost"></h2>
      </div>
      <p class="t-body" data-i18n="sudoku.lostNote"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" id="retryBtn" data-i18n="sudoku.retry"></button>
        <button type="button" class="btn btn-primary" id="lostNewBtn" data-i18n="sudoku.newPuzzle"></button>
      </div>
    </form>
  </dialog>

  <p class="visually-hidden" id="announce" role="status" aria-live="polite"></p>
</body>
</html>
