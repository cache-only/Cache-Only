<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/sudoku/styles.css">
  <title>Sudoku · Cache Only</title>
  <script type="module" src="/games/sudoku/sudoku.js"></script>
</head>
<body class="game-page sudoku-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></symbol>
    <symbol id="i-games" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM8 10h.01M12 10h.01M16 10h.01M8 14h8"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 10H6v10h12V10h-2M12 3v11M8 7l4-4 4 4"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
    <symbol id="i-erase" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7zM12 9l6 6M18 9l-6 6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16zM14 7l3 3"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  </svg>

  <div class="shell">
    <header class="bar">
      <button type="button" class="icon-btn" id="homeBtn" data-i18n-label="common.menu">
        <svg class="icon"><use href="#i-home"/></svg>
      </button>
      <div class="bar-stats">
        <div class="stat">
          <span class="stat-label" id="levelLabel">&nbsp;</span>
          <span class="stat-value" id="timer">00:00</span>
        </div>
      </div>
    </header>

    <main class="play">
      <div class="board-wrap" id="boardWrap">
        <div class="board sudoku-board" id="board" role="group" data-i18n-label="sudoku.board"></div>
        <p class="board-note eyebrow" id="genNote" role="status" data-i18n="sudoku.generating" hidden></p>
      </div>

      <div class="controls">
        <div class="tools">
          <button type="button" class="tool" id="undoBtn"><span class="icon-btn"><svg class="icon"><use href="#i-undo"/></svg></span><span data-i18n="common.undo"></span></button>
          <button type="button" class="tool" id="redoBtn"><span class="icon-btn"><svg class="icon"><use href="#i-redo"/></svg></span><span data-i18n="common.redo"></span></button>
          <button type="button" class="tool" id="eraseBtn"><span class="icon-btn"><svg class="icon"><use href="#i-erase"/></svg></span><span data-i18n="sudoku.erase"></span></button>
          <button type="button" class="tool" id="notesBtn" aria-pressed="false"><span class="icon-btn"><svg class="icon"><use href="#i-pencil"/></svg></span><span data-i18n="sudoku.notes"></span></button>
          <button type="button" class="tool" id="hintBtn"><span class="icon-btn"><svg class="icon"><use href="#i-hint"/></svg></span><span data-i18n="sudoku.hint"></span></button>
        </div>

        <div class="keypad" id="pad">
          <button type="button" class="key" data-d="1">1</button>
          <button type="button" class="key" data-d="2">2</button>
          <button type="button" class="key" data-d="3">3</button>
          <button type="button" class="key" data-d="4">4</button>
          <button type="button" class="key" data-d="5">5</button>
          <button type="button" class="key" data-d="6">6</button>
          <button type="button" class="key" data-d="7">7</button>
          <button type="button" class="key" data-d="8">8</button>
          <button type="button" class="key" data-d="9">9</button>
        </div>
      </div>
    </main>
  </div>

  <div class="side-menu" id="sideMenu" hidden>
    <div class="side-menu-blur pblur pblur-left" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <nav class="side-menu-list" data-i18n-label="common.menu">
      <p class="side-menu-title eyebrow" id="menuTitle"></p>
      <button type="button" class="side-item" id="resumeBtn">
        <svg class="icon"><use href="#i-play"/></svg><span data-i18n="sudoku.resume"></span>
      </button>
      <button type="button" class="side-item" id="menuNewBtn">
        <svg class="icon"><use href="#i-new"/></svg><span data-i18n="sudoku.newPuzzle"></span>
      </button>
      <button type="button" class="side-item" id="menuEnterBtn">
        <svg class="icon"><use href="#i-enter"/></svg><span data-i18n="sudoku.enter"></span>
      </button>
      <button type="button" class="side-item" id="shareBtn">
        <svg class="icon"><use href="#i-share"/></svg><span data-i18n="sudoku.share"></span>
      </button>
      <label class="side-item">
        <svg class="icon"><use href="#i-warn"/></svg><span data-i18n="sudoku.showConflicts"></span>
        <input type="checkbox" class="switch" id="conflictsToggle" role="switch">
      </label>
      <a class="side-item is-exit" href="/">
        <svg class="icon"><use href="#i-games"/></svg><span data-i18n="common.back"></span>
      </a>
    </nav>
  </div>

  <dialog class="sheet" id="newSheet" aria-labelledby="newTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="newTitle" data-i18n="sudoku.newPuzzle"></h2>
        <button class="icon-btn" value="close" id="newClose" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <section class="sheet-section">
        <h3 class="eyebrow" data-i18n="sudoku.difficulty"></h3>
        <div class="segmented" role="group" id="levels" data-i18n-label="sudoku.difficulty"></div>
        <p class="t-note" id="levelInfo"></p>
      </section>
      <div class="sheet-actions">
        <button type="button" class="btn" id="newEnterBtn" data-i18n="sudoku.enter"></button>
        <button type="button" class="btn btn-primary" id="startBtn" data-i18n="sudoku.start"></button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="doneSheet" aria-labelledby="doneTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="doneTitle" data-i18n="sudoku.solved"></h2>
      </div>
      <p class="eyebrow" id="newBest" data-i18n="sudoku.newBest" hidden></p>
      <dl class="facts">
        <dt data-i18n="sudoku.difficulty"></dt><dd id="doneLevel"></dd>
        <dt data-i18n="sudoku.time"></dt><dd class="is-num" id="doneTime"></dd>
        <dt data-i18n="sudoku.hints"></dt><dd class="is-num" id="doneHints"></dd>
      </dl>
      <button type="button" class="btn btn-primary" id="doneNewBtn" data-i18n="sudoku.newPuzzle"></button>
    </form>
  </dialog>

  <dialog class="sheet" id="enterSheet" aria-labelledby="enterTitle">
    <form method="dialog" class="sheet-inner" id="enterForm">
      <div class="sheet-head">
        <h2 class="t-title" id="enterTitle" data-i18n="sudoku.enter"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <p class="t-body" data-i18n="sudoku.enterHelp"></p>
      <textarea id="enterText" class="field" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      <p class="msg" id="enterMsg" role="status"></p>
      <button type="button" class="btn btn-primary" id="enterGo" data-i18n="sudoku.enterPlay"></button>
    </form>
  </dialog>

  <dialog class="sheet" id="shareSheet" aria-labelledby="shareTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="shareTitle" data-i18n="sudoku.share"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <p class="t-body" data-i18n="sudoku.shareHelp"></p>
      <p class="field is-code" id="shareCode"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" id="copyBtn"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="common.copy"></span></button>
        <button type="button" class="btn btn-primary" id="sendBtn"><svg class="icon"><use href="#i-share"/></svg><span data-i18n="common.share"></span></button>
      </div>
    </form>
  </dialog>
</body>
</html>
