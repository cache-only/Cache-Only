<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/sudoku/styles.css">
  <title>Sudoku · Cache Only</title>
  <script type="module" src="/games/sudoku/sudoku.js"></script>
</head>
<body class="game-page sudoku-page">
  <div class="status-tint" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-erase" viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6M18 9l-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 10H6v10h12V10h-2"/><path d="M12 3v11M8 7l4-4 4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  </svg>

  <div class="shell">
    <header class="bar">
      <div class="bar-row">
        <a class="icon-btn" href="/" data-i18n-label="common.back"><svg class="icon"><use href="#i-back"/></svg></a>
        <div class="bar-title">
          <span class="flight-tag">GP 01</span>
          <h1>Sudoku</h1>
        </div>
        <div class="bar-stat">
          <span class="label" id="levelLabel">&nbsp;</span>
          <span class="value" id="timer">00:00</span>
        </div>
        <button type="button" class="icon-btn" id="pauseBtn" data-i18n-label="sudoku.pause"><svg class="icon"><use href="#i-pause"/></svg></button>
        <button type="button" class="icon-btn" id="menuBtn" data-i18n-label="sudoku.menu"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </header>

    <main class="play">
      <div class="board-wrap" id="boardWrap">
        <div class="board sudoku-board" id="board" role="group" data-i18n-label="sudoku.board"></div>

        <div class="overlay" id="ovStart" hidden>
          <div class="overlay-card">
            <p class="overlay-title" data-i18n="sudoku.newPuzzle"></p>
            <div class="levels" data-levels></div>
            <button type="button" class="btn" data-action="enter" data-i18n="sudoku.enter"></button>
          </div>
        </div>

        <div class="overlay" id="ovGen" hidden>
          <div class="overlay-card">
            <div class="spinner" aria-hidden="true"></div>
            <p class="overlay-title" data-i18n="sudoku.generating" role="status"></p>
          </div>
        </div>

        <div class="overlay" id="ovPause" hidden>
          <div class="overlay-card">
            <p class="overlay-title" data-i18n="sudoku.paused"></p>
            <button type="button" class="btn btn-primary" id="resumeBtn">
              <svg class="icon"><use href="#i-play"/></svg><span data-i18n="sudoku.resume"></span>
            </button>
          </div>
        </div>

        <div class="overlay" id="ovDone" hidden>
          <div class="overlay-card">
            <p class="overlay-title" data-i18n="sudoku.solved"></p>
            <p class="flight-tag new-best" id="newBest" data-i18n="sudoku.newBest" hidden></p>
            <dl class="facts done-facts">
              <dt data-i18n="sudoku.difficulty"></dt><dd id="doneLevel"></dd>
              <dt data-i18n="sudoku.time"></dt><dd id="doneTime"></dd>
              <dt data-i18n="sudoku.hints"></dt><dd id="doneHints"></dd>
            </dl>
            <button type="button" class="btn btn-primary" data-action="new" data-i18n="sudoku.newPuzzle"></button>
          </div>
        </div>
      </div>

      <div class="tools">
        <button type="button" class="tool" id="undoBtn" data-i18n-label="common.undo"><svg class="icon"><use href="#i-undo"/></svg><span data-i18n="common.undo"></span></button>
        <button type="button" class="tool" id="redoBtn" data-i18n-label="common.redo"><svg class="icon"><use href="#i-redo"/></svg><span data-i18n="common.redo"></span></button>
        <button type="button" class="tool" id="notesBtn" aria-pressed="false" data-i18n-label="sudoku.notes"><svg class="icon"><use href="#i-pencil"/></svg><span data-i18n="sudoku.notes"></span></button>
        <button type="button" class="tool" id="hintBtn" data-i18n-label="sudoku.hint"><svg class="icon"><use href="#i-hint"/></svg><span data-i18n="sudoku.hint"></span></button>
      </div>

      <div class="pad" id="pad">
        <button type="button" class="key" data-d="1">1</button>
        <button type="button" class="key" data-d="2">2</button>
        <button type="button" class="key" data-d="3">3</button>
        <button type="button" class="key" data-d="4">4</button>
        <button type="button" class="key" data-d="5">5</button>
        <button type="button" class="key" data-d="6">6</button>
        <button type="button" class="key" data-d="7">7</button>
        <button type="button" class="key" data-d="8">8</button>
        <button type="button" class="key" data-d="9">9</button>
        <button type="button" class="key key-erase" id="eraseBtn" data-i18n-label="sudoku.erase"><svg class="icon"><use href="#i-erase"/></svg></button>
      </div>
    </main>
  </div>

  <dialog class="sheet" id="menuSheet" aria-labelledby="menuTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="menuTitle">Sudoku</h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <section class="sheet-section">
        <h3 class="label" data-i18n="sudoku.newPuzzle"></h3>
        <div class="levels" data-levels></div>
      </section>
      <section class="sheet-section">
        <div class="sheet-actions" style="justify-content:flex-start">
          <button type="button" class="btn" data-action="enter" data-i18n="sudoku.enter"></button>
          <button type="button" class="btn" data-action="share" id="shareBtn" data-i18n="sudoku.share"></button>
        </div>
      </section>
      <section class="sheet-section">
        <label class="switch-row">
          <span data-i18n="sudoku.showConflicts"></span>
          <input type="checkbox" id="conflictsToggle" role="switch">
        </label>
      </section>
    </form>
  </dialog>

  <dialog class="sheet" id="enterSheet" aria-labelledby="enterTitle">
    <form method="dialog" class="sheet-inner" id="enterForm">
      <div class="sheet-head">
        <h2 id="enterTitle" data-i18n="sudoku.enter"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <p class="sheet-msg" data-i18n="sudoku.enterHelp"></p>
      <textarea id="enterText" class="puzzle-input mono" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      <p class="sheet-msg" id="enterMsg" role="status"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" id="enterGo" data-i18n="sudoku.enterPlay"></button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="shareSheet" aria-labelledby="shareTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="shareTitle" data-i18n="sudoku.share"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <p class="sheet-msg" data-i18n="sudoku.shareHelp"></p>
      <p class="puzzle-code mono" id="shareCode"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" id="copyBtn"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="common.copy"></span></button>
        <button type="button" class="btn btn-primary" id="sendBtn"><svg class="icon"><use href="#i-share"/></svg><span data-i18n="common.share"></span></button>
      </div>
    </form>
  </dialog>
</body>
</html>
