<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/2048/styles.css">
  <title>2048 · Cache Only</title>
  <script type="module" src="/games/2048/game.js"></script>
</head>
<body class="game-page page-2048">
  <div class="status-tint" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <div class="shell">
    <header class="bar">
      <div class="bar-row">
        <a class="icon-btn" href="/" data-i18n-label="common.back"><svg class="icon"><use href="#i-back"/></svg></a>
        <div class="bar-title">
          <span class="flight-tag">GP 02</span>
          <h1>2048</h1>
        </div>
        <div class="bar-stat score-stat">
          <span class="label" data-i18n="g2048.score"></span>
          <span class="value" id="score">0</span>
        </div>
        <div class="bar-stat">
          <span class="label" data-i18n="g2048.best"></span>
          <span class="value" id="best">0</span>
        </div>
      </div>
    </header>

    <main class="play">
      <div class="actions-2048">
        <button type="button" class="btn" id="undoBtn"><svg class="icon"><use href="#i-undo"/></svg><span data-i18n="common.undo"></span></button>
        <button type="button" class="btn" id="newBtn"><svg class="icon"><use href="#i-new"/></svg><span data-i18n="common.newGame"></span></button>
      </div>

      <div class="board-wrap" id="boardWrap">
        <div class="board board-2048" id="board" role="application" data-i18n-label="g2048.board" tabindex="0">
          <div class="cells" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="tiles" id="tiles"></div>
        </div>

        <div class="overlay" id="ovWin" hidden>
          <div class="overlay-card">
            <span class="flight-tag">2048</span>
            <p class="overlay-title" data-i18n="g2048.won"></p>
            <p class="overlay-text" data-i18n="g2048.wonText"></p>
            <div class="overlay-actions">
              <button type="button" class="btn" id="winNewBtn" data-i18n="common.newGame"></button>
              <button type="button" class="btn btn-primary" id="keepBtn" data-i18n="g2048.keepPlaying"></button>
            </div>
          </div>
        </div>

        <div class="overlay" id="ovOver" hidden>
          <div class="overlay-card">
            <p class="overlay-title" data-i18n="g2048.over"></p>
            <p class="overlay-text" id="overText"></p>
            <div class="overlay-actions">
              <button type="button" class="btn" id="overUndoBtn"><svg class="icon"><use href="#i-undo"/></svg><span data-i18n="common.undo"></span></button>
              <button type="button" class="btn btn-primary" id="overNewBtn" data-i18n="common.newGame"></button>
            </div>
          </div>
        </div>
      </div>

      <p class="hint-2048" data-i18n="g2048.hint"></p>
    </main>
  </div>
</body>
</html>
