<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/tanks/styles.css">
  <title>Tanks · Cache Only</title>
  <script type="module" src="/games/tanks/tanks.js"></script>
</head>
<body class="game-page page-tanks">
  <div class="shell">
    <header class="bar">
      <button type="button" class="icon-btn" id="homeBtn" data-i18n-label="common.menu">
        <svg class="icon"><use href="#i-home"/></svg>
      </button>
      <div class="bar-stats">
        <div class="stat">
          <span class="stat-label" data-i18n="tanks.mission"></span>
          <span class="stat-value" id="missionStat">--</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="tanks.lives"></span>
          <span class="stat-value" id="livesStat">-</span>
        </div>
        <div class="stat-meters" id="ammo" role="img">
          <span class="meter" id="shellMeter"></span>
          <span class="meter" id="mineMeter"></span>
        </div>
        <button type="button" class="icon-btn icon-btn-primary edit-play" id="playMapBtn" data-i18n-label="tanks.playThis">
          <svg class="icon"><use href="#i-play"/></svg>
        </button>
      </div>
    </header>

    <main class="play play-tanks">
      <div class="board-wrap tanks-wrap" id="boardWrap">
        <canvas class="arena" id="arena" role="img" data-i18n-label="tanks.board"></canvas>

        <div class="banner notice" id="banner" role="status" aria-live="polite" hidden>
          <p class="t-title" id="bannerTitle"></p>
          <p class="t-heading" id="bannerName"></p>
          <p class="eyebrow" id="bannerSub"></p>
          <p class="banner-tanks" id="bannerTanks" aria-hidden="true"></p>
          <p class="t-note banner-note" id="bannerNote"></p>
        </div>
      </div>

      <div class="controls edit-tools">
        <p class="t-note edit-note" id="editNote" role="status" aria-live="polite"></p>
        <div class="tools" role="group" id="editBrushes" data-i18n-label="tanks.tools">
          <button type="button" class="tool" data-brush="#"><span class="icon-btn"><canvas class="swatch" data-cell="#"></canvas></span><span data-i18n="tanks.tool.wall"></span></button>
          <button type="button" class="tool" data-brush="x"><span class="icon-btn"><canvas class="swatch" data-cell="x"></canvas></span><span data-i18n="tanks.tool.crate"></span></button>
          <button type="button" class="tool" data-brush="o"><span class="icon-btn"><canvas class="swatch" data-cell="o"></canvas></span><span data-i18n="tanks.tool.hole"></span></button>
          <button type="button" class="tool" data-brush="."><span class="icon-btn"><svg class="icon"><use href="#i-erase"/></svg></span><span data-i18n="tanks.tool.erase"></span></button>
          <button type="button" class="tool" data-brush="@"><span class="icon-btn"><canvas class="swatch" data-cell="@"></canvas></span><span data-i18n="tanks.tool.you"></span></button>
          <button type="button" class="tool" data-brush="enemy" id="enemyTool"><span class="icon-btn"><canvas class="swatch" id="enemySwatch"></canvas></span><span id="enemyName"></span></button>
          <button type="button" class="tool" id="undoTool"><span class="icon-btn"><svg class="icon"><use href="#i-undo"/></svg></span><span data-i18n="common.undo"></span></button>
        </div>
      </div>

      <div class="pads" id="pads" role="application" data-i18n-label="tanks.pads">
        <div class="stick stick-move" id="moveStick" aria-hidden="true"><span class="knob"></span></div>
        <div class="stick stick-aim" id="aimStick" aria-hidden="true"><span class="knob"><svg class="icon slot"><use class="full" href="#i-shell"/><use class="empty" href="#i-shell-empty"/></svg></span></div>
        <button type="button" class="mine-btn" id="mineBtn" data-i18n-label="tanks.mine">
          <svg class="icon slot"><use class="full" href="#i-mine"/><use class="empty" href="#i-mine-empty"/></svg>
        </button>
      </div>
    </main>

    <div class="pblur pblur-top pblur-deep edge-top" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <div class="pblur pblur-bottom pblur-deep edge-bottom" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <div class="pblur pblur-side pblur-deep edge-left" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="pblur pblur-side pblur-deep edge-right" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <div class="side-menu" id="sideMenu" hidden>
    <div class="side-menu-blur pblur pblur-left" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <nav class="side-menu-list" data-i18n-label="common.menu">
      <button type="button" class="side-item" id="resumeBtn">
        <svg class="icon"><use href="#i-play"/></svg><span data-i18n="tanks.resume"></span>
      </button>
      <button type="button" class="side-item" id="quitBtn">
        <svg class="icon"><use href="#i-flag"/></svg><span data-i18n="tanks.quit" id="quitLabel"></span>
      </button>
      <button type="button" class="side-item edit-item" id="mapsBtn">
        <svg class="icon"><use href="#i-list"/></svg><span data-i18n="tanks.mapsTitle"></span>
      </button>
      <label class="side-item edit-item">
        <svg class="icon"><use href="#i-mirror"/></svg><span data-i18n="tanks.mirror"></span>
        <input type="checkbox" class="switch" id="mirrorToggle" role="switch">
      </label>
      <button type="button" class="side-item edit-item" id="renameBtn">
        <svg class="icon"><use href="#i-pencil"/></svg><span data-i18n="tanks.rename"></span>
      </button>
      <button type="button" class="side-item edit-item" id="deleteBtn">
        <svg class="icon"><use href="#i-trash"/></svg><span data-i18n="tanks.deleteMap"></span>
      </button>
      <a class="side-item is-exit" href="/">
        <svg class="icon"><use href="#i-games"/></svg><span data-i18n="common.back"></span>
      </a>
    </nav>
  </div>

  <dialog class="sheet" id="startSheet" aria-labelledby="startTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head"><h2 class="t-title" id="startTitle" data-i18n="tanks.title"></h2></div>
      <p class="t-body" data-i18n="tanks.intro"></p>
      <p class="eyebrow" id="record"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" id="testBtn" data-i18n="tanks.test"></button>
        <button type="button" class="btn" id="mapsOpenBtn" data-i18n="tanks.maps"></button>
      </div>
      <button type="button" class="btn" id="newBtn" data-i18n="tanks.newCampaign"></button>
      <button type="button" class="btn btn-primary" id="startBtn"></button>
      <section class="sheet-section" id="menuCheckpoints"></section>
      <p class="t-note" id="help"></p>
    </form>
  </dialog>

  <dialog class="sheet" id="testSheet" aria-labelledby="testTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="testTitle" data-i18n="tanks.testTitle"></h2>
        <button type="button" class="icon-btn" id="testClose" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-cols">
        <div class="sheet-col">
          <section class="sheet-section">
            <h3 class="eyebrow" id="testKindLabel"></h3>
            <div class="segmented is-grid" role="group" id="testKinds" data-i18n-label="tanks.testEnemy"></div>
          </section>
        </div>
        <div class="sheet-col">
          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="tanks.testCount"></h3>
            <div class="segmented" role="group" id="testCount" data-i18n-label="tanks.testCount"></div>
            <p class="t-note" data-i18n="tanks.testIntro"></p>
          </section>
          <button type="button" class="btn btn-primary" id="testStart" data-i18n="tanks.testStart"></button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="mapsSheet" aria-labelledby="mapsTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="mapsTitle" data-i18n="tanks.mapsTitle"></h2>
        <button type="button" class="icon-btn" id="mapsClose" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-cols">
        <div class="sheet-col">
          <section class="sheet-section">
            <p class="t-body" id="mapsIntro"></p>
            <div class="segmented is-list" role="group" id="mapList" data-i18n-label="tanks.mapsTitle"></div>
            <p class="t-note" id="mapStatus"></p>
          </section>
        </div>
        <div class="sheet-col">
          <div class="sheet-actions">
            <button type="button" class="btn" id="editMapBtn" data-i18n="tanks.editMap"></button>
            <button type="button" class="btn" id="newMapBtn" data-i18n="tanks.newMap"></button>
          </div>
          <button type="button" class="btn btn-primary" id="playListBtn" data-i18n="tanks.playMap"></button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="kindSheet" aria-labelledby="kindTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="kindTitle" data-i18n="tanks.testEnemy"></h2>
        <button type="button" class="icon-btn" id="kindClose" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="segmented is-grid" role="group" id="kindGrid" data-i18n-label="tanks.testEnemy"></div>
    </form>
  </dialog>

  <dialog class="sheet" id="renameSheet" aria-labelledby="renameTitle">
    <form method="dialog" class="sheet-inner" id="renameForm">
      <div class="sheet-head">
        <h2 class="t-title" id="renameTitle" data-i18n="tanks.renameTitle"></h2>
        <button type="button" class="icon-btn" id="renameClose" data-i18n-label="common.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <input type="text" class="field is-line" id="renameInput" maxlength="24" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" data-i18n-label="tanks.mapName">
      <button type="submit" class="btn btn-primary" data-i18n="tanks.save"></button>
    </form>
  </dialog>

  <dialog class="sheet" id="overSheet" aria-labelledby="overTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head"><h2 class="t-title" id="overTitle"></h2></div>
      <p class="eyebrow" id="newRecord" data-i18n="tanks.newRecord" hidden></p>
      <dl class="facts">
        <dt data-i18n="tanks.reached"></dt><dd class="is-num" id="overMission"></dd>
        <dt data-i18n="tanks.destroyedCount"></dt><dd class="is-num" id="overKills"></dd>
      </dl>
      <p class="tally" id="tally"></p>
      <button type="button" class="btn btn-primary" id="againBtn" data-i18n="tanks.playAgain"></button>
      <section class="sheet-section" id="overCheckpoints"></section>
    </form>
  </dialog>
</body>
</html>
