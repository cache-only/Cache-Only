<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gameplane">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/games/tanks/styles.css">
  <title>Tanks · Gameplane</title>
  <script type="module" src="/games/tanks/tanks.js"></script>
</head>
<body class="game-page page-tanks">
  <div class="status-tint" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-mine" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.4 2.4M16.3 16.3l2.4 2.4M18.7 5.3l-2.4 2.4M7.7 16.3l-2.4 2.4"/></symbol>
  </svg>

  <div class="shell">
    <header class="bar">
      <div class="bar-row">
        <a class="icon-btn" href="/" data-i18n-label="common.back"><svg class="icon"><use href="#i-back"/></svg></a>
        <div class="bar-title">
          <span class="flight-tag">GP 03</span>
          <h1 data-i18n="tanks.title"></h1>
        </div>
        <div class="bar-stat">
          <span class="label" data-i18n="tanks.mission"></span>
          <span class="value" id="missionStat">--</span>
        </div>
        <div class="bar-stat">
          <span class="label" data-i18n="tanks.lives"></span>
          <span class="value" id="livesStat">-</span>
        </div>
        <button type="button" class="icon-btn" id="pauseBtn" data-i18n-label="tanks.pause" disabled><svg class="icon"><use href="#i-pause"/></svg></button>
      </div>
    </header>

    <main class="play play-tanks">
      <div class="board-wrap tanks-wrap" id="boardWrap">
        <canvas class="arena" id="arena" role="img" data-i18n-label="tanks.board"></canvas>

        <div class="banner" id="banner" role="status" aria-live="polite" hidden>
          <p class="banner-title" id="bannerTitle"></p>
          <p class="banner-sub" id="bannerSub"></p>
          <p class="banner-tanks" id="bannerTanks" aria-hidden="true"></p>
          <p class="banner-note" id="bannerNote"></p>
        </div>

        <div class="overlay" id="ovMenu" hidden>
          <div class="overlay-card menu-card">
            <span class="flight-tag">GP 03</span>
            <p class="overlay-title" data-i18n="tanks.title"></p>
            <p class="overlay-text" data-i18n="tanks.intro"></p>
            <div class="menu-actions">
              <button type="button" class="btn btn-primary" id="startBtn"></button>
              <button type="button" class="btn" id="newBtn" data-i18n="tanks.newCampaign"></button>
            </div>
            <div class="checkpoints" id="menuCheckpoints"></div>
            <p class="record" id="record"></p>
            <p class="help" id="help"></p>
          </div>
        </div>

        <div class="overlay" id="ovPause" hidden>
          <div class="overlay-card">
            <p class="overlay-title" data-i18n="tanks.paused"></p>
            <button type="button" class="btn btn-primary" id="resumeBtn">
              <svg class="icon"><use href="#i-play"/></svg><span data-i18n="tanks.resume"></span>
            </button>
            <label class="switch-row sound-row">
              <span data-i18n="tanks.sound"></span>
              <input type="checkbox" id="soundToggle" role="switch">
            </label>
            <button type="button" class="btn" id="quitBtn" data-i18n="tanks.quit"></button>
          </div>
        </div>

        <div class="overlay" id="ovOver" hidden>
          <div class="overlay-card">
            <p class="overlay-title" id="overTitle"></p>
            <p class="flight-tag new-record" id="newRecord" data-i18n="tanks.newRecord" hidden></p>
            <dl class="facts over-facts">
              <dt data-i18n="tanks.reached"></dt><dd id="overMission"></dd>
              <dt data-i18n="tanks.destroyedCount"></dt><dd id="overKills"></dd>
            </dl>
            <p class="tally" id="tally"></p>
            <div class="menu-actions">
              <button type="button" class="btn btn-primary" id="againBtn" data-i18n="tanks.playAgain"></button>
            </div>
            <div class="checkpoints" id="overCheckpoints"></div>
          </div>
        </div>
      </div>

      <div class="controls" id="controls">
        <div class="zone zone-move" id="moveZone" role="application" data-i18n-label="tanks.move">
          <div class="stick" id="moveStick"><span class="knob"></span></div>
          <span class="zone-label" data-i18n="tanks.moveShort" aria-hidden="true"></span>
        </div>
        <button type="button" class="mine-btn" id="mineBtn" data-i18n-label="tanks.mine">
          <svg class="icon"><use href="#i-mine"/></svg>
          <span class="pips" id="minePips" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div class="zone zone-aim" id="aimZone" role="application" data-i18n-label="tanks.aim">
          <div class="stick" id="aimStick"><span class="knob"></span></div>
          <span class="zone-label" data-i18n="tanks.aimShort" aria-hidden="true"></span>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
