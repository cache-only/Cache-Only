<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="application-name" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Games that keep working in airplane mode.">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Cache Only</title>
  <script type="module" src="/launcher.js"></script>
</head>
<body class="launcher">
  <!-- Only settings floats up here, at the top right. The logo is in the page, over the suggested
       game; the status words are there for screen readers. -->
  <header class="bar">
    <span class="visually-hidden" id="statusLine" role="status" aria-live="polite"></span>
    <!-- While an update waits, the settings button turns white: the update icon takes the
         settings icon's place and "Update" grows out to its left. -->
    <div class="bar-actions" id="barActions" hidden>
      <button type="button" class="bar-update" id="reloadBtn" data-i18n-label="update.text" hidden>
        <span class="bar-update-label" data-i18n="update.action"></span><svg class="icon"><use href="#i-update"/></svg>
      </button>
      <button type="button" class="icon-btn" id="openSettings" data-i18n-label="launcher.settings">
        <svg class="icon"><use href="#i-settings"/></svg>
      </button>
    </div>
  </header>

  <div class="pblur pblur-top edge-top" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <!-- Landscape: the games scroll sideways, under these. -->
  <div class="pblur pblur-side edge-left" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <div class="pblur pblur-side edge-right" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

  <!-- A browser tab: the app icon's pixel field across the whole page (shared/pixel-field.js). -->
  <div class="pixel-field" id="installField" aria-hidden="true" hidden></div>

  <main class="home" id="home">
    <!-- The installed app: one square (.lead) holding the logo, large and centred over the
         suggested game's art (it is the status: it comes into focus once the app is ready offline
         and as games download), with the suggested game at its foot; then a note while offline,
         then every game and the fillers still to come. While nothing is downloaded, the same panel
         offers every game (.is-all): no art, no eyebrow, and a download icon for its button. -->
    <div class="lead">
      <div class="hero" id="hero" aria-hidden="true"></div>

      <div class="home-mark" id="homeMark" aria-hidden="true"></div>

      <section class="suggest" id="suggest" hidden>
        <h2 class="eyebrow" data-i18n="launcher.suggested"></h2>
        <div class="panel">
          <span class="panel-text t-title" id="suggestName"></span>
          <a class="btn btn-primary" id="suggestBtn"></a>
          <button type="button" class="btn btn-primary btn-icon" id="getAllBtn" data-i18n-label="launcher.downloadAll" hidden>
            <svg class="icon"><use href="#i-download"/></svg>
          </button>
        </div>
      </section>
    </div>

    <p class="t-note home-note" id="homeNote"></p>

    <section class="games" id="gamesSection" hidden>
      <ul class="tile-grid" id="games"></ul>
    </section>

    <!-- First launch: the app shell is still downloading. -->
    <section class="intro prepare" id="prepare" hidden>
      <div class="intro-mark" id="prepareMark"><div class="intro-logo"></div></div>
      <div class="intro-side">
        <div class="intro-text">
          <p class="eyebrow" id="prepareCount" aria-live="polite"></p>
          <h1 class="t-title" id="prepareTitle"></h1>
          <p class="t-body" id="prepareText"></p>
        </div>
        <h2 class="eyebrow" data-i18n="launcher.games"></h2>
        <div class="ghost-tiles" id="ghostTiles" aria-hidden="true"></div>
        <p class="t-note" data-i18n="prepare.note"></p>
      </div>
    </section>

    <!-- A browser tab: only how to install, over the pixel field (#installField). -->
    <section class="intro install" id="install" hidden>
      <!-- No header on this page: the logo and the name are one lockup. The logo only holds the
           place of the field's lit mark. -->
      <div class="intro-mark" id="installMark">
        <div class="intro-logo"></div>
        <p class="t-display">Cache Only</p>
      </div>
      <div class="intro-side">
        <h1 class="t-title" data-i18n="install.title"></h1>
        <ol class="steps" id="installSteps"></ol>
        <p class="eyebrow install-version" id="installVersion" hidden></p>
      </div>
    </section>
  </main>

  <div class="pblur pblur-bottom edge-bottom" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="settingsTitle" data-i18n="settings.title"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="sheet-cols">
        <div class="sheet-col">
          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.language"></h3>
            <div class="segmented" role="group" data-i18n-label="settings.language">
              <button type="button" data-lang="en" lang="en">English</button>
              <button type="button" data-lang="ca" lang="ca">Català</button>
            </div>
          </section>

          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.sound"></h3>
            <!-- One switch for every sound in the app (shared/sound.js). -->
            <label class="toggle-row">
              <span data-i18n="settings.soundEffects"></span>
              <input type="checkbox" class="switch" id="soundToggle" role="switch">
            </label>
          </section>

          <section class="sheet-section sheet-last">
            <!-- Answers in its own label: No updates, or white with Update (launcher.js). -->
            <button type="button" class="btn" id="checkUpdateBtn" data-i18n="settings.check" aria-live="polite"></button>
          </section>
        </div>

        <div class="sheet-col">
          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.saves"></h3>
            <div class="sheet-actions">
              <button type="button" class="btn" id="exportBtn" data-i18n="settings.export"></button>
              <button type="button" class="btn" id="importBtn" data-i18n="settings.import"></button>
            </div>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
            <p class="msg" id="savesMsg" role="status"></p>
          </section>

          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.device"></h3>
            <dl class="facts">
              <dt data-i18n="settings.version"></dt><dd class="is-num" id="factVersion">—</dd>
              <dt data-i18n="settings.games"></dt><dd class="is-num" id="factGames">—</dd>
            </dl>
          </section>
        </div>
      </div>
    </form>
  </dialog>
</body>
</html>
