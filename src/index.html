<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gameplane">
  <meta name="application-name" content="Gameplane">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Games that keep working in airplane mode.">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Gameplane</title>
  <script type="module" src="/launcher.js"></script>
</head>
<body class="launcher">
  <div class="status-tint" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plane" viewBox="0 0 32 32">
      <path d="M28 5 3.5 15.2l9.7 3.3z" fill="currentColor"/>
      <path d="M28 5 14.6 19.7l4 8.3z" fill="currentColor"/>
      <path d="m13.2 18.5 1.4 1.2-.9 6.3z" fill="currentColor" opacity=".55"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 10H6v10h12V10h-2"/><path d="M12 3v11M8 7l4-4 4 4"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
  </svg>

  <header class="bar masthead">
    <div class="bar-row">
      <div class="brand">
        <svg class="brand-mark" style="color:var(--signal)" aria-hidden="true"><use href="#i-plane"/></svg>
        <span class="wordmark">Gameplane</span>
      </div>
      <div class="segmented lang-switch" role="group" data-i18n-label="launcher.language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ca" lang="ca">CA</button>
      </div>
      <button type="button" class="icon-btn" id="openSettings" data-i18n-label="launcher.settings">
        <svg class="icon"><use href="#i-settings"/></svg>
      </button>
    </div>
    <div class="status" id="status" data-state="checking" role="status" aria-live="polite" hidden>
      <span class="status-light" aria-hidden="true"></span>
      <span class="status-line">
        <span class="status-text" id="statusText"></span>
        <span class="status-version" id="statusVersion"></span>
      </span>
      <span class="status-hint" id="statusHint"></span>
    </div>
  </header>

  <main class="launcher-main">
    <section class="notice update" id="updateBanner" hidden>
      <p data-i18n="update.text"></p>
      <button type="button" class="btn" id="reloadBtn" data-i18n="update.reload"></button>
    </section>

    <section class="notice install" id="installCard" hidden>
      <h2 class="notice-title" data-i18n="install.title"></h2>
      <p id="installText"></p>
      <div class="install-steps" id="installSteps" aria-hidden="true">
        <span><svg class="icon"><use href="#i-share"/></svg>1</span>
        <svg class="icon"><use href="#i-arrow"/></svg>
        <span><svg class="icon"><use href="#i-add"/></svg>2</span>
        <svg class="icon"><use href="#i-arrow"/></svg>
        <span><svg class="icon" style="color:var(--text)"><use href="#i-plane"/></svg>3</span>
      </div>
      <p class="notice-note" data-i18n="install.note"></p>
    </section>

    <section class="games" id="gamesSection" hidden>
      <h2 class="section-label" data-i18n="launcher.games"></h2>
      <div class="download-all" id="downloadAll" hidden>
        <button type="button" class="btn btn-primary" id="downloadAllBtn">
          <svg class="icon"><use href="#i-download"/></svg><span id="downloadAllText"></span>
        </button>
      </div>
      <ol class="departures" id="games"></ol>
    </section>

    <footer class="launcher-foot">
      <span>Gameplane</span>
      <span id="footVersion"></span>
    </footer>
  </main>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="settingsTitle" data-i18n="settings.title"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <section class="sheet-section">
        <h3 class="label" data-i18n="settings.language"></h3>
        <div class="segmented" role="group" data-i18n-label="settings.language">
          <button type="button" data-lang="en" lang="en">English</button>
          <button type="button" data-lang="ca" lang="ca">Català</button>
        </div>
      </section>

      <section class="sheet-section">
        <h3 class="label" data-i18n="settings.saves"></h3>
        <div class="sheet-actions" style="justify-content:flex-start">
          <button type="button" class="btn" id="exportBtn" data-i18n="settings.export"></button>
          <button type="button" class="btn" id="importBtn" data-i18n="settings.import"></button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <p class="sheet-msg" id="savesMsg" role="status"></p>
      </section>

      <section class="sheet-section">
        <h3 class="label" data-i18n="settings.device"></h3>
        <dl class="facts">
          <dt data-i18n="settings.version"></dt><dd id="factVersion">—</dd>
          <dt data-i18n="settings.offline"></dt><dd id="factOffline">—</dd>
          <dt data-i18n="settings.games"></dt><dd id="factGames">—</dd>
          <dt data-i18n="settings.persisted"></dt><dd id="factPersisted">—</dd>
        </dl>
        <div class="sheet-actions" style="justify-content:flex-start">
          <button type="button" class="btn" id="checkUpdateBtn" data-i18n="settings.check"></button>
        </div>
        <p class="sheet-msg" id="updateMsg" role="status"></p>
      </section>
    </form>
  </dialog>
</body>
</html>
