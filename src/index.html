<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cache Only">
  <meta name="application-name" content="Cache Only">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Games that keep working in airplane mode.">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Cache Only</title>
  <script type="module" src="/launcher.js"></script>
</head>
<body class="launcher">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 10H6v10h12V10h-2"/><path d="M12 3v11M8 7l4-4 4 4"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="18.5" r="1.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5V8h-3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  </svg>

  <header class="bar">
    <span id="barLogo" class="bar-logo"></span>
    <div class="bar-title">
      <span class="wordmark">Cache Only</span>
      <span class="status-line" id="statusLine" role="status" aria-live="polite"></span>
    </div>
    <!-- While an update waits, the settings circle grows to the left into a pill with Update. -->
    <div class="bar-actions" id="barActions" hidden>
      <button type="button" class="bar-update" id="reloadBtn" data-i18n-label="update.text" hidden>
        <span><svg class="icon"><use href="#i-update"/></svg><span class="bar-update-label" data-i18n="update.action"></span></span>
      </button>
      <button type="button" class="icon-btn" id="openSettings" data-i18n-label="launcher.settings">
        <svg class="icon"><use href="#i-settings"/></svg>
      </button>
    </div>
  </header>

  <div class="pblur pblur-top edge-top" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

  <main class="home" id="home">
    <div class="hero" id="hero" aria-hidden="true"></div>

    <!-- The installed app: the suggested game, then every game. -->
    <section class="suggest" id="suggest" hidden>
      <h2 class="eyebrow" data-i18n="launcher.suggested"></h2>
      <div class="panel">
        <span class="panel-text t-title" id="suggestName"></span>
        <a class="btn btn-primary" id="suggestBtn"></a>
      </div>
    </section>

    <section class="games" id="gamesSection" hidden>
      <div class="section-head">
        <h2 class="eyebrow" data-i18n="launcher.games"></h2>
        <button type="button" class="btn-small" id="downloadAllBtn" hidden>
          <span><svg class="icon"><use href="#i-download"/></svg><span data-i18n="launcher.downloadAll"></span></span>
        </button>
      </div>
      <ul class="tile-grid" id="games"></ul>
      <p class="t-note home-note" id="homeNote"></p>
    </section>

    <!-- First launch: the app shell is still downloading. -->
    <section class="intro prepare" id="prepare" hidden>
      <div class="intro-mark" id="prepareMark"><div class="intro-logo"></div></div>
      <div class="intro-side">
        <div class="intro-text">
          <p class="eyebrow" id="prepareCount" aria-live="polite"></p>
          <h1 class="t-title" id="prepareTitle"></h1>
          <p class="t-body" id="prepareText"></p>
        </div>
        <h2 class="eyebrow" data-i18n="launcher.games"></h2>
        <div class="ghost-tiles" id="ghostTiles" aria-hidden="true"></div>
        <p class="t-note" data-i18n="prepare.note"></p>
      </div>
    </section>

    <!-- A browser tab: only how to install. -->
    <section class="intro install" id="install" hidden>
      <!-- No header on this page: the logo and the name are one lockup. -->
      <div class="intro-mark" id="installMark">
        <div class="intro-logo"></div>
        <p class="t-heading">Cache Only</p>
      </div>
      <div class="intro-text">
        <h1 class="t-title" data-i18n="install.title"></h1>
        <p class="t-body" data-i18n="install.lead"></p>
      </div>
      <div class="intro-side">
        <ol class="steps" id="installSteps"></ol>
        <p class="t-note" data-i18n="install.note"></p>
      </div>
    </section>
  </main>

  <div class="pblur pblur-bottom edge-bottom" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 class="t-title" id="settingsTitle" data-i18n="settings.title"></h2>
        <button class="icon-btn" value="close" data-i18n-label="common.close">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="sheet-cols">
        <div class="sheet-col">
          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.language"></h3>
            <div class="segmented" role="group" data-i18n-label="settings.language">
              <button type="button" data-lang="en" lang="en">English</button>
              <button type="button" data-lang="ca" lang="ca">Català</button>
            </div>
          </section>

          <section class="sheet-section">
            <h3 class="eyebrow" data-i18n="settings.saves"></h3>
            <div class="sheet-actions">
              <button type="button" class="btn" id="exportBtn" data-i18n="settings.export"></button>
              <button type="button" class="btn" id="importBtn" data-i18n="settings.import"></button>
            </div>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
            <p class="msg" id="savesMsg" role="status"></p>
          </section>

          <section class="sheet-section sheet-last">
            <button type="button" class="btn" id="checkUpdateBtn" data-i18n="settings.check"></button>
            <p class="msg" id="updateMsg" role="status"></p>
          </section>
        </div>

        <section class="sheet-section">
          <h3 class="eyebrow" data-i18n="settings.device"></h3>
          <dl class="facts">
            <dt data-i18n="settings.version"></dt><dd class="is-num" id="factVersion">—</dd>
            <dt data-i18n="settings.offline"></dt><dd id="factOffline">—</dd>
            <dt data-i18n="settings.games"></dt><dd class="is-num" id="factGames">—</dd>
            <dt data-i18n="settings.persisted"></dt><dd id="factPersisted">—</dd>
          </dl>
        </section>
      </div>
    </form>
  </dialog>
</body>
</html>
